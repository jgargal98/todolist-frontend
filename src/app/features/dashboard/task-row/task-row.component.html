<div class="task-row" (click)="edit.emit(task())">
  <!-- Title row -->
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 0.5rem">
      <span style="font-size: 1rem; font-weight: 500">{{ task().title }}</span>
      <p-tag [value]="task().status | taskStatusLabel" [severity]="task().status | taskStatusSeverity" style="font-size: 0.75rem" />
    </div>
    <p-button icon="pi pi-ellipsis-v" [link]="true" severity="secondary" />
  </div>
  <!-- Metadata row -->
  <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.625rem">
    @if (task().dueDate) {
      <div style="display: flex; align-items: center; gap: 0.375rem">
        <i class="pi pi-calendar" style="font-size: 0.8125rem; color: var(--p-text-secondary-color)"></i>
        <span style="font-size: 0.8125rem; color: var(--p-text-secondary-color)">{{ task().dueDate | date: 'MMM d, yyyy' }}</span>
      </div>
    }
    <p-tag [value]="task().subTasks.length + ' subtasks'" severity="info" style="font-size: 0.75rem" />
    @if (task().categoryName) {
      <p-tag [value]="task().categoryName" style="font-size: 0.75rem" />
    }
  </div>
</div>
