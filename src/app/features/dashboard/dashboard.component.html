<div style="display: flex; height: 100%; width: 100%">
  <p-splitter
    layout="horizontal"
    [style]="{ height: '100%', flex: '1', minWidth: 0 }"
    [panelSizes]="[20, 80]"
    [minSizes]="[15, 40]"
  >
    <!-- LEFT SIDEBAR — status filters, categories, tags, and nav links -->
    <ng-template pTemplate="panel">
      <app-dashboard-sidebar
        [statusItems]="statusItems"
        [categories]="categories"
        [tags]="tags"
        (filterByStatus)="filterByStatus($event)"
        (addCategory)="addCategory()"
        (addTag)="addTag()"
        (openCalendar)="openCalendar()"
        (logout)="logout()"
      />
    </ng-template>

    <!-- CENTER PANEL — task list with inline metadata (status tag, due date, subtask count) -->
    <ng-template pTemplate="panel">
      <p-scrollPanel style="height: 100%">
        <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem">
          <!-- Header with count -->
          <div style="display: flex; align-items: center; justify-content: space-between">
            <div style="display: flex; align-items: center; gap: 0.75rem">
              <span style="font-size: 1.5rem; font-weight: 600">All Tasks</span>
              <p-badge [value]="tasks.length" severity="secondary" />
            </div>
          </div>

          <!-- Add Task Trigger -->
          <div style="display: flex">
            <p-button label="New Task" icon="pi pi-plus" (click)="openNewTaskPanel()" />
          </div>

          <!-- Task List -->
          <div style="display: flex; flex-direction: column">
            @for (task of tasks; track task.id) {
              <app-task-row [task]="task" (edit)="editTask($event)" />
              @if (!$last) {
                <p-divider style="margin: 0" />
              }
            }
          </div>
        </div>
      </p-scrollPanel>
    </ng-template>
  </p-splitter>

  <!-- RIGHT PANEL — slide-in task form (create/edit). Dumb component, all events bubble up via @Output -->
  @if (showRightPanel) {
    <task-detail-panel
      [visible]="showRightPanel"
      [task]="editingTask"
      [statusOptions]="statusOptions"
      [categoryOptions]="categoryOptions"
      [tagOptions]="tagOptions"
      (close)="closeRightPanel()"
      (save)="onSaveTask($event)"
      (deleteTask)="onDeleteTask($event)"
    />
  }
</div>

<p-confirmDialog />

<!-- Structural dialog placeholders — hidden until the corresponding feature logic is implemented -->
<p-dialog header="Add Task" [visible]="false" [modal]="true" [style]="{ width: '32rem' }">
  <div style="display: flex; flex-direction: column; gap: 1rem">
    <input pInputText [fluid]="true" placeholder="Task title" />
    <textarea pTextarea [fluid]="true" rows="3" placeholder="Description"></textarea>
    <p-select
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Select list"
      [fluid]="true"
    />
  </div>
</p-dialog>

<p-dialog header="Add Category" [visible]="false" [modal]="true" [style]="{ width: '28rem' }">
  <div style="display: flex; flex-direction: column; gap: 1rem">
    <input pInputText [fluid]="true" placeholder="Category name" />
  </div>
</p-dialog>

<p-dialog header="Add Tag" [visible]="false" [modal]="true" [style]="{ width: '28rem' }">
  <div style="display: flex; flex-direction: column; gap: 1rem">
    <input pInputText [fluid]="true" placeholder="Tag name" />
  </div>
</p-dialog>
